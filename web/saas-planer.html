<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Планер · Облако</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #f1f5f9;
      --bg-grad: linear-gradient(160deg, #f8fafc 0%, #eef2ff 50%, #f1f5f9 100%);
      --surface: #ffffff;
      --surface2: #f8fafc;
      --surface3: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #334155;
      --muted: #64748b;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --accent-hover: #4338ca;
      --accent-glow: rgba(79, 70, 229, 0.18);
      --success: #059669;
      --success-soft: #d1fae5;
      --warning: #d97706;
      --warning-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --purple: #7c3aed;
      --purple-soft: #f3e8ff;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-lg: 18px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
      --shadow: 0 1px 3px rgba(15,23,42,.05), 0 6px 16px rgba(15,23,42,.04);
      --shadow-md: 0 4px 12px rgba(15,23,42,.06), 0 12px 28px rgba(15,23,42,.05);
      --shadow-lg: 0 10px 40px rgba(15,23,42,.1);
      --sidebar-w: 268px;
      --header-h: 60px;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      background-image: var(--bg-grad);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    ::selection { background: var(--accent-soft); color: var(--accent); }

    /* ——— Layout ——— */
    .app { display: flex; min-height: 100dvh; }
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-sm);
    }
    .sidebar-brand {
      height: var(--header-h);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: -0.02em;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      display: grid; place-items: center; color: #fff; font-size: .95rem;
      font-weight: 800; box-shadow: 0 4px 12px rgba(79,70,229,.35);
    }
    .nav { padding: 14px 12px; flex: 1; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 14px; border-radius: 11px;
      color: var(--muted); font-weight: 500; font-size: .9rem;
      cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
      transition: all .18s ease;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      box-shadow: inset 0 0 0 1px rgba(79,70,229,.12);
    }
    .nav-item .ico { width: 22px; text-align: center; font-size: 1.05rem; opacity: .9; }
    .nav-section {
      font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); padding: 18px 14px 8px; font-weight: 600;
    }
    .sidebar-foot {
      padding: 14px 16px; border-top: 1px solid var(--border);
      font-size: .78rem; color: var(--muted);
      background: var(--surface2);
    }
    .sync-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 7px; vertical-align: middle;
      box-shadow: 0 0 0 3px transparent;
    }
    .sync-dot.on { background: var(--success); box-shadow: 0 0 0 3px rgba(5,150,105,.2); }
    .sync-dot.off { background: #94a3b8; }
    .sync-dot.err { background: var(--danger); box-shadow: 0 0 0 3px rgba(220,38,38,.2); }
    .sync-dot.wait { background: var(--warning); box-shadow: 0 0 0 3px rgba(217,119,6,.2); }

    .main {
      flex: 1; margin-left: var(--sidebar-w); min-width: 0;
      display: flex; flex-direction: column; min-height: 100dvh;
    }
    .topbar {
      height: var(--header-h);
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; gap: 12px; position: sticky; top: 0; z-index: 40;
    }
    .topbar-title { font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
    .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .menu-btn {
      display: none; border: 1px solid var(--border); background: var(--surface);
      width: 42px; height: 42px; border-radius: 11px; cursor: pointer;
      transition: background .15s;
    }
    .menu-btn:hover { background: var(--surface2); }
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(15,23,42,.4);
      backdrop-filter: blur(2px); z-index: 45;
    }
    .overlay.show { display: block; }
    .content { padding: 24px; flex: 1; max-width: 1400px; }

    /* ——— Buttons ——— */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 18px; border-radius: 11px; border: none; font-weight: 600;
      font-size: .875rem; cursor: pointer; transition: all .18s ease;
      letter-spacing: -0.01em;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      box-shadow: 0 2px 8px rgba(79,70,229,.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      box-shadow: 0 4px 14px rgba(79,70,229,.4);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover { background: var(--surface2); border-color: var(--border-strong); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-danger:hover { background: #fecaca; }
    .btn-success { background: var(--success); color: #fff; box-shadow: 0 2px 8px rgba(5,150,105,.25); }
    .btn-success:hover { background: #047857; }
    .btn-sm { padding: 7px 13px; font-size: .8rem; border-radius: 9px; }

    /* ——— Stats ——— */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
      transition: transform .2s, box-shadow .2s;
    }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat .lbl { font-size: .75rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; letter-spacing: .01em; }
    .stat .val { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.03em; }
    .stat.green .val { color: var(--success); }
    .stat.indigo .val { color: var(--accent); }

    /* ——— Cards ——— */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
    }
    .card + .card { margin-top: 14px; }
    .section-title {
      font-size: 1rem; font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px;
      border-radius: 999px; font-size: .7rem; font-weight: 600;
      letter-spacing: .01em;
    }
    .badge-green { background: var(--success-soft); color: var(--success); }
    .badge-amber { background: var(--warning-soft); color: var(--warning); }
    .badge-red { background: var(--danger-soft); color: var(--danger); }
    .badge-indigo { background: var(--accent-soft); color: var(--accent); }
    .badge-gray { background: var(--surface3); color: var(--muted); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center;
    }
    .search { flex: 1; min-width: 200px; position: relative; }
    .search input {
      width: 100%; padding: 11px 14px 11px 40px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
    }
    .search input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search::before {
      content: "⌕"; position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); color: var(--muted); font-size: 1.05rem;
    }
    .tabs {
      display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 11px 16px; border: none; background: transparent;
      color: var(--muted); font-weight: 600; font-size: .875rem;
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab .cnt {
      background: var(--surface3); color: var(--muted);
      padding: 2px 8px; border-radius: 999px; font-size: .7rem; margin-left: 5px;
    }
    .tab.active .cnt { background: var(--accent-soft); color: var(--accent); }

    /* ——— Board / Kanban ——— */
    .board {
      display: flex; gap: 14px; overflow-x: auto; padding-bottom: 14px; min-height: 440px;
      scrollbar-width: thin;
    }
    .col {
      flex: 0 0 290px; background: var(--surface2);
      border-radius: var(--radius); border: 1px solid var(--border);
      display: flex; flex-direction: column; max-height: calc(100dvh - 210px);
      box-shadow: var(--shadow-sm);
    }
    .col-h {
      padding: 13px 15px; font-weight: 700; font-size: .88rem;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      letter-spacing: -0.01em;
    }
    .col-h .n {
      background: var(--surface3); color: var(--muted);
      font-size: .72rem; padding: 2px 9px; border-radius: 999px; font-weight: 600;
    }
    .col-b {
      padding: 12px; overflow-y: auto; flex: 1;
      display: flex; flex-direction: column; gap: 10px; min-height: 60px;
    }
    .col-b.drag-over {
      outline: 2px dashed var(--accent); outline-offset: -4px;
      background: var(--accent-soft);
    }
    .deal-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 14px; cursor: grab; box-shadow: var(--shadow-sm);
      transition: all .18s ease;
    }
    .deal-card:hover {
      border-color: rgba(79,70,229,.4);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .deal-card.dragging { opacity: .45; transform: rotate(1.5deg); }
    .deal-card .t { font-weight: 650; font-size: .9rem; margin-bottom: 5px; letter-spacing: -0.01em; }
    .deal-card .sub { font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
    .deal-card .meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: .7rem; }
    .col-work .col-h { border-left: 3px solid var(--accent); }
    .col-demo .col-h { border-left: 3px solid var(--purple); }
    .col-deal .col-h { border-left: 3px solid var(--success); }
    .col-ref-p .col-h { border-left: 3px solid var(--danger); }
    .col-ref-m .col-h { border-left: 3px solid var(--warning); }

    .list-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 15px 17px; margin-bottom: 10px;
      cursor: pointer; transition: all .18s ease;
    }
    .list-item:hover {
      border-color: rgba(79,70,229,.35);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .list-item h4 { font-size: .95rem; margin-bottom: 5px; font-weight: 650; letter-spacing: -0.01em; }
    .list-item .row { font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
    .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: .9rem; }

    /* ——— Modal ——— */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(15,23,42,.5);
      backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100; opacity: 0; visibility: hidden; transition: .22s; padding: 12px;
    }
    .modal-bg.open { opacity: 1; visibility: visible; }
    .modal {
      background: var(--surface); border-radius: 20px 20px 14px 14px;
      width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto;
      box-shadow: var(--shadow-lg);
      transform: translateY(24px); transition: .22s cubic-bezier(.4,0,.2,1);
    }
    .modal-bg.open .modal { transform: translateY(0); }
    @media (min-width: 640px) {
      .modal-bg { align-items: center; }
      .modal { border-radius: 18px; }
    }
    .modal-h {
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .modal-h h3 { font-size: 1.08rem; font-weight: 700; letter-spacing: -0.02em; }
    .modal-x {
      border: none; background: var(--surface2); width: 34px; height: 34px;
      border-radius: 10px; cursor: pointer; font-size: 1.15rem; color: var(--muted);
      transition: background .15s, color .15s;
    }
    .modal-x:hover { background: var(--surface3); color: var(--text); }
    .modal-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-f {
      padding: 14px 20px 20px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
    }
    .fg label {
      display: block; font-size: .75rem; color: var(--muted); margin-bottom: 5px; font-weight: 500;
    }
    .fg input, .fg select, .fg textarea {
      width: 100%; padding: 11px 13px; border: 1px solid var(--border);
      border-radius: 11px; background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
    }
    .fg textarea { min-height: 88px; resize: vertical; }
    .fg input:focus, .fg select:focus, .fg textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

    .pulse-bars {
      display: flex; align-items: flex-end; gap: 10px; height: 130px; margin-top: 14px;
    }
    .pulse-bars .bar-wrap {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
      height: 100%; justify-content: flex-end;
    }
    .pulse-bars .bar {
      width: 100%; max-width: 38px; border-radius: 8px 8px 3px 3px;
      background: linear-gradient(180deg, #818cf8, #4f46e5); min-height: 4px;
      transition: height .4s ease;
      box-shadow: 0 2px 8px rgba(79,70,229,.25);
    }
    .pulse-bars .dl { font-size: .68rem; color: var(--muted); font-weight: 500; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; left: 24px;
      max-width: 380px; margin-left: auto;
      background: #0f172a; color: #fff; padding: 14px 18px;
      border-radius: 14px; z-index: 200; opacity: 0; transform: translateY(14px);
      transition: .28s cubic-bezier(.4,0,.2,1); font-size: .9rem; pointer-events: none;
      box-shadow: var(--shadow-lg);
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .view { display: none; }
    .view.active { display: block; animation: fadeIn .25s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hint { font-size: .85rem; color: var(--muted); margin-bottom: 16px; }
    .steps {
      background: var(--surface2); border-radius: 12px; padding: 16px;
      font-size: .85rem; line-height: 1.65; margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .steps ol { margin-left: 18px; }
    .steps code {
      background: var(--surface); padding: 2px 7px; border-radius: 5px;
      font-size: .8rem; border: 1px solid var(--border);
    }
    .status-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 14px; background: var(--surface2); border-radius: 12px;
      font-size: .85rem; margin-bottom: 16px; border: 1px solid var(--border);
    }

    @media (max-width: 860px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
      .main { margin-left: 0; }
      .menu-btn { display: grid; place-items: center; }
      .col { flex: 0 0 270px; }
      .content { padding: 16px; }
      .topbar { padding: 0 16px; }
    }
  </style>
</head>
